  .form-field__input { color:var(--text-primary); background:transparent; border:0; font-size:14px; line-height:20px; padding:0; width:100%; outline:none; }
  .form-field__input:disabled { color: var(--text-subdued); }
  input[type=radio] { accent-color: var(--radio); width:16px; height:16px; }
  details > summary { list-style:none; } details > summary::-webkit-details-marker { display:none; }
  details[open] .rot-180 { transform: rotate(180deg); } details[open] .rot-90 { transform: rotate(90deg); }

  .btn:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
  .btn-primary { background:var(--bg-inverse); color:var(--text-inverse); }
  .btn-secondary { background:var(--btn-secondary); color:var(--text-primary); }
  .btn-outline { border:1px solid var(--border-secondary); color:var(--text-primary); }
  .btn-outline-destructive { border:1px solid var(--border-secondary); color:var(--destructive); }
  .btn-destructive { background:var(--btn-destructive); color:var(--text-inverse); }
  .btn-ghost { color:var(--text-primary); }
  .btn-sm { padding:4px 8px; border-radius:8px; }
  .dimmed { opacity:.6; transition: opacity 150ms; }
  @media (prefers-reduced-motion: reduce) { .dimmed { transition: none; } }
  /* Mockup chrome only (not part of the design) */
  .chrome-label { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .02em; color: var(--text-secondary); }
  .frame-375 { width: 100%; max-width: 375px; }
  .col-300 { width: 100%; max-width: 300px; }

  [data-lucide] { display:inline-block; }

  .text-pretty { text-wrap: pretty; }
