# Override to run the app against the TEST database (maybe_test) on port 3001,
# next to a real instance on 3000. Usage (repo root):
#   docker compose -f compose.yaml -f docs/dev/compose.test-db.yaml build web
#   docker compose -f compose.yaml -f docs/dev/compose.test-db.yaml up -d --no-deps web worker
# Running `bin/rails test` reloads fixtures in maybe_test and wipes anything created in the UI.
#
# Always build with this override so the branch image is tagged maybe-finance:dev and never
# overwrites maybe-finance:local, which the production instance (project maybe-finance) uses:
#   docker compose -f compose.yaml -f docs/dev/compose.test-db.yaml build web
services:
  web:
    image: maybe-finance:dev
    ports: !override
      - 3001:3000
    environment:
      POSTGRES_DB: maybe_test
  worker:
    image: maybe-finance:dev
    environment:
      POSTGRES_DB: maybe_test
